name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck & Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit

      - name: Start test databases
        run: docker compose up -d --wait

      - name: Init Mongo replica set
        run: node scripts/init-mongo-rs.mjs

      - name: Wait for db ports
        run: node scripts/wait-for-db.mjs

      - name: Init fixtures
        run: |
          pnpm db:init || (sleep 15 && pnpm db:init)   # 首次失败重试一次（mysql 冷启动可能断连）

      - name: Integration tests (Node)
        if: matrix.runtime == 'node'
        run: pnpm test:integration
        env:
          SQLTRANSLATOR_TEST_MYSQL5_HOST: 127.0.0.1
          SQLTRANSLATOR_TEST_MYSQL5_PORT: 33061
          SQLTRANSLATOR_TEST_MYSQL5_USER: root
          SQLTRANSLATOR_TEST_MYSQL5_PASSWORD: root
          SQLTRANSLATOR_TEST_MYSQL8_HOST: 127.0.0.1
          SQLTRANSLATOR_TEST_MYSQL8_PORT: 33062
          SQLTRANSLATOR_TEST_MYSQL8_USER: root
          SQLTRANSLATOR_TEST_MYSQL8_PASSWORD: root
          SQLTRANSLATOR_TEST_PG_HOST: 127.0.0.1
          SQLTRANSLATOR_TEST_PG_PORT: 54321
          SQLTRANSLATOR_TEST_PG_USER: test
          SQLTRANSLATOR_TEST_PG_PASSWORD: test
          SQLTRANSLATOR_TEST_MONGO_URI: mongodb://127.0.0.1:27017
          SQLTRANSLATOR_TEST_MONGO_RS_URI: mongodb://127.0.0.1:27018

      - name: Integration tests (Bun)
        if: matrix.runtime == 'bun'
        run: pnpm test:bun   # 含 --timeout 30000（mongo-rs 副本集首连可能 >5s）
        env:
          SQLTRANSLATOR_TEST_MYSQL5_HOST: 127.0.0.1
          SQLTRANSLATOR_TEST_MYSQL5_PORT: 33061
          SQLTRANSLATOR_TEST_MYSQL5_USER: root
          SQLTRANSLATOR_TEST_MYSQL5_PASSWORD: root
          SQLTRANSLATOR_TEST_MYSQL8_HOST: 127.0.0.1
          SQLTRANSLATOR_TEST_MYSQL8_PORT: 33062
          SQLTRANSLATOR_TEST_MYSQL8_USER: root
          SQLTRANSLATOR_TEST_MYSQL8_PASSWORD: root
          SQLTRANSLATOR_TEST_PG_HOST: 127.0.0.1
          SQLTRANSLATOR_TEST_PG_PORT: 54321
          SQLTRANSLATOR_TEST_PG_USER: test
          SQLTRANSLATOR_TEST_PG_PASSWORD: test
          SQLTRANSLATOR_TEST_MONGO_URI: mongodb://127.0.0.1:27017
          SQLTRANSLATOR_TEST_MONGO_RS_URI: mongodb://127.0.0.1:27018

      - name: Teardown databases
        if: always()
        run: docker compose down -v
