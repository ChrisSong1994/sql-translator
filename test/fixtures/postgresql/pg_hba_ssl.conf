# PostgreSQL 强制 SSL：仅 hostssl（TLS）连接通过，非 TLS TCP 一律拒绝
# 挂载为 postgres-ssl 服务的 hba_file
local   all             all                                     trust
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::0/0                   scram-sha-256
